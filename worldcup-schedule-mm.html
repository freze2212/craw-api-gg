<style type="text/css">.gift-fall-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 9999;
}


.gift {
  position: absolute;
  top: -100px;
  width: 70px;
  height: 70px;
  opacity: 0.9;
  animation: fall 7s linear infinite;
}

.gift-1 { left: 1%; animation-delay: 0s; }
.gift-2 { left: 32%; animation-delay: 1s; }
.gift-3 { left: 48%; animation-delay: 2s; }
.gift-4 { left: 64%; animation-delay: 3s; }
.gift-5 { left: 80%; animation-delay: 4s; }

@keyframes fall {
  0% {
    transform: translateY(-120px) rotate(0deg);
