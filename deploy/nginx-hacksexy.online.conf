# Nginx — hacksexy.online → World Cup API (port 5290)
# VPS: 160.22.161.170
#
#   sudo cp deploy/nginx-hacksexy.online.conf /etc/nginx/sites-available/hacksexy.online
#   sudo ln -sf /etc/nginx/sites-available/hacksexy.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hacksexy.online

server {
    listen 80;
    server_name hacksexy.online 160.22.161.170;
    return 301 https://hacksexy.online$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hacksexy.online;

    # Certbot sẽ tự điền ssl_certificate sau khi chạy certbot --nginx
    # ssl_certificate     /etc/letsencrypt/live/hacksexy.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hacksexy.online/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5290;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
